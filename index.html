<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetLog AI - Rejestracja Wydatków</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Biblioteka OCR do odczytywania tekstu ze zdjęć w przeglądarce -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4 pb-20 transition-colors duration-200">

  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Nagłówek -->
    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <span>🚛</span> FleetLog — Rejestr
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Automatyczny odczyt paragonów i kosztów</p>
      </div>
      <button type="button" onclick="toggleDarkMode()" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-xl text-lg hover:scale-105 transition-transform">
        <span id="themeIcon">🌙</span>
      </button>
    </div>

    <!-- Formularz -->
    <form id="expenseForm" onsubmit="saveExpense(event)" class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
      
      <!-- Aparat / Skaner na samej górze dla wygody -->
      <div>
        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Zrób zdjęcie paragonu (Skaner OCR)</label>
        <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)" class="hidden">
        
        <button type="button" onclick="document.getElementById('photoInput').click()" class="w-full py-3.5 px-4 border-2 border-dashed border-blue-400 dark:border-blue-600 hover:border-blue-500 rounded-xl bg-blue-50/50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300 font-bold flex items-center justify-center gap-2 transition-colors">
          <span>📷</span> Zrób zdjęcie paragonu
        </button>
        
        <!-- Pasek postępu skanowania -->
        <div id="ocrStatus" class="hidden mt-2 p-3 bg-slate-100 dark:bg-slate-700 rounded-xl text-xs space-y-1">
          <div class="flex justify-between font-bold text-slate-700 dark:text-slate-200">
            <span id="ocrStatusText">Skanowanie paragonu...</span>
            <span id="ocrPercent">0%</span>
          </div>
          <div class="w-full bg-slate-200 dark:bg-slate-600 h-2 rounded-full overflow-hidden">
            <div id="ocrProgressBar" class="bg-blue-600 h-full w-0 transition-all duration-200"></div>
          </div>
        </div>

        <div id="photoPreviewContainer" class="hidden mt-2 relative">
          <img id="photoPreview" src="" class="w-full h-32 object-cover rounded-xl border border-slate-200 dark:border-slate-700">
          <button type="button" onclick="removePhoto()" class="absolute top-2 right-2 bg-red-600 text-white rounded-full p-1 text-xs px-2 shadow">✕ Usuń</button>
        </div>
      </div>

      <!-- Wybór Pojazdu -->
      <div>
        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Pojazd</label>
        <select id="vehicle" required class="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <!-- Dynamicznie wczytywane -->
        </select>
      </div>

      <!-- Kategoria & Data -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Kategoria</label>
          <select id="category" onchange="toggleFuelFields()" class="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="Paliwo">Paliwo</option>
            <option value="Opłata drogowa">e-TOLL / Autostrada</option>
            <option value="Serwis">Serwis / Części</option>
            <option value="Inne">Inne wydatki</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Data</label>
          <input type="date" id="date" required class="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <!-- Pola specyficzne dla paliwa -->
      <div id="fuelFields" class="grid grid-cols-2 gap-3 bg-blue-50/50 dark:bg-blue-900/20 p-3 rounded-xl border border-blue-100 dark:border-blue-800">
        <div>
          <label class="block text-xs font-bold text-blue-700 dark:text-blue-400 uppercase mb-1">Litry (L)</label>
          <input type="number" step="0.01" id="fuelLiters" placeholder="np. 55.40" class="w-full p-2.5 border dark:border-slate-600 dark:bg-slate-700 rounded-lg font-medium focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-700 dark:text-blue-400 uppercase mb-1">Stan licznika (km)</label>
          <input type="number" id="mileage" placeholder="np. 284500" class="w-full p-2.5 border dark:border-slate-600 dark:bg-slate-700 rounded-lg font-medium focus:outline-none">
        </div>
      </div>

      <!-- Kwota i Waluta -->
      <div class="grid grid-cols-3 gap-3">
        <div class="col-span-2">
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Kwota brutto</label>
          <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Waluta</label>
          <select id="currency" class="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="PLN">PLN</option>
            <option value="EUR">EUR</option>
          </select>
        </div>
      </div>

      <!-- Zapis -->
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-95">
        💾 Zapisz Wydatek
      </button>

    </form>

    <!-- Ostatnio dodane lokalnie -->
    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
      <div class="flex justify-between items-center border-b dark:border-slate-700 pb-2">
        <h2 class="font-bold text-slate-800 dark:text-slate-200 text-sm">Ostatnie wpisy z tego telefonu</h2>
        <button onclick="exportToCSV()" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 px-2.5 py-1 rounded-lg font-semibold text-slate-600 dark:text-slate-300">📁 Pobierz CSV</button>
      </div>
      <div id="recentExpensesList" class="space-y-2 text-xs text-slate-500 dark:text-slate-400">
        <p class="text-center py-2">Brak wpisów w pamięci.</p>
      </div>
    </div>

  </div>

  <!-- Modal Podglądu Zdjęcia -->
  <div id="photoModal" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm" onclick="closePhotoModal()">
    <div class="relative max-w-3xl max-h-[90vh] w-full flex flex-col items-center justify-center" onclick="event.stopPropagation()">
      <button type="button" onclick="closePhotoModal()" class="absolute -top-10 right-0 text-white bg-red-600 hover:bg-red-700 px-3 py-1 rounded-full text-sm font-bold shadow-lg">
        ✕ Zamknij
      </button>
      <img id="modalImage" src="" alt="Paragon" class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl border border-white/20">
    </div>
  </div>

  <!-- Dolny Pasek Nawigacji PWA -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex justify-around items-center p-2 shadow-lg z-50">
    <a href="index.html" class="flex flex-col items-center text-xs font-semibold text-blue-600 dark:text-blue-400 focus:outline-none py-1">
      <span class="text-xl">➕</span>
      <span>Dodaj Wydatek</span>
    </a>
    <a href="panel.html" class="flex flex-col items-center text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-blue-600 focus:outline-none py-1">
      <span class="text-xl">📊</span>
      <span>Flota i Koszty</span>
    </a>
  </nav>

  <script>
    let currentCompressedPhoto = null;
    const defaultVehicles = [
      { registration: 'LLE 44468', name: 'Audi A4 B6' },
      { registration: 'LUB 6894R', name: 'Opel' }
    ];

    document.getElementById('date').valueAsDate = new Date();

    function initTheme() {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').innerText = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').innerText = '🌙';
      }
    }

    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        document.getElementById('themeIcon').innerText = '🌙';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        document.getElementById('themeIcon').innerText = '☀️';
      }
    }

    function loadVehicleOptions() {
      const storedVehicles = JSON.parse(localStorage.getItem('fleet_vehicles') || 'null');
      const vehicles = storedVehicles || defaultVehicles;
      const select = document.getElementById('vehicle');
      
      select.innerHTML = vehicles.map(v => `
        <option value="${v.registration}">${v.name} (${v.registration})</option>
      `).join('');
    }

    function toggleFuelFields() {
      const cat = document.getElementById('category').value;
      const fuelFields = document.getElementById('fuelFields');
      if (cat === 'Paliwo') {
        fuelFields.classList.remove('hidden');
      } else {
        fuelFields.classList.add('hidden');
      }
    }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          const maxWidth = 1000;
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          currentCompressedPhoto = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('photoPreview').src = currentCompressedPhoto;
          document.getElementById('photoPreviewContainer').classList.remove('hidden');

          // Uruchomienie skanera OCR
          runOCRScanner(currentCompressedPhoto);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Funkcja analizująca tekst ze zdjęcia za pomocą Tesseract.js
    async function runOCRScanner(imageSrc) {
      const statusDiv = document.getElementById('ocrStatus');
      const statusText = document.getElementById('ocrStatusText');
      const progressBar = document.getElementById('ocrProgressBar');
      const percentText = document.getElementById('ocrPercent');

      statusDiv.classList.remove('hidden');
      statusText.innerText = "Inicjalizacja skanera...";
      progressBar.style.width = "0%";
      percentText.innerText = "0%";

      try {
        const worker = await Tesseract.createWorker('pol');
        
        const ret = await worker.recognize(imageSrc);
        const text = ret.data.text;
        
        statusText.innerText = "Analizowanie danych z paragonu...";
        progressBar.style.width = "100%";
        percentText.innerText = "100%";

        parseReceiptText(text);

        await worker.terminate();

        setTimeout(() => {
          statusDiv.classList.add('hidden');
        }, 1500);

      } catch (err) {
        console.error("Błąd OCR:", err);
        statusText.innerText = "Nie udało się odczytać tekstu automatycznie.";
        setTimeout(() => {
          statusDiv.classList.add('hidden');
        }, 2000);
      }
    }

    // Parser tekstu paragonu
    function parseReceiptText(text) {
      console.log("Odczytany tekst z OCR:\n", text);

      // Wykrywanie waluty
      if (text.includes('EUR') || text.includes('€')) {
        document.getElementById('currency').value = 'EUR';
      } else {
        document.getElementById('currency').value = 'PLN';
      }

      // Szukanie litrów (np. "55,40 l" lub "55.40L")
      const literMatch = text.match(/(\d+[\.,]\d{2})\s*(l|L|litr|litry)/i);
      if (literMatch) {
        const liters = parseFloat(literMatch[1].replace(',', '.'));
        if (!isNaN(liters)) {
          document.getElementById('fuelLiters').value = liters;
          document.getElementById('category').value = 'Paliwo';
          toggleFuelFields();
        }
      }

      // Szukanie kwoty brutto / SUMA (np. "SUMA 250,50" lub "PLN 250.50")
      const sumMatch = text.match(/(SUMA|PLN|EUR|RAZEM|TOTAL)[\s\:=]*(\d+[\.,]\d{2})/i) || 
                       text.match(/(\d+[\.,]\d{2})\s*(PLN|EUR)/i);

      if (sumMatch) {
        const valStr = sumMatch[2] || sumMatch[1];
        const amount = parseFloat(valStr.replace(',', '.'));
        if (!isNaN(amount)) {
          document.getElementById('amount').value = amount;
        }
      }
    }

    function removePhoto() {
      currentCompressedPhoto = null;
      document.getElementById('photoInput').value = '';
      document.getElementById('photoPreviewContainer').classList.add('hidden');
    }

    function saveExpense(e) {
      e.preventDefault();

      const expense = {
        id: Date.now(),
        date: document.getElementById('date').value,
        vehicle: document.getElementById('vehicle').value,
        category: document.getElementById('category').value,
        amount_gross: parseFloat(document.getElementById('amount').value),
        currency: document.getElementById('currency').value,
        fuel_liters: document.getElementById('category').value === 'Paliwo' ? parseFloat(document.getElementById('fuelLiters').value) || null : null,
        mileage: document.getElementById('category').value === 'Paliwo' ? parseInt(document.getElementById('mileage').value) || null : null,
        photo: currentCompressedPhoto
      };

      const existing = JSON.parse(localStorage.getItem('fleet_expenses') || '[]');
      existing.push(expense);
      localStorage.setItem('fleet_expenses', JSON.stringify(existing));

      alert('Wydatek został zapisany!');
      document.getElementById('expenseForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      removePhoto();
      toggleFuelFields();
      renderRecentExpenses();
    }

    function renderRecentExpenses() {
      const existing = JSON.parse(localStorage.getItem('fleet_expenses') || '[]');
      const container = document.getElementById('recentExpensesList');

      if (existing.length === 0) {
        container.innerHTML = '<p class="text-center py-2">Brak wpisów w pamięci.</p>';
        return;
      }

      container.innerHTML = existing.slice().reverse().slice(0, 5).map(e => `
        <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-100 dark:border-slate-700">
          <div>
            <span class="font-bold text-slate-800 dark:text-slate-200">${e.vehicle}</span> — ${e.category}
            <div class="text-[10px] text-slate-400 dark:text-slate-400">${e.date} ${e.fuel_liters ? '| ' + e.fuel_liters + ' L' : ''}</div>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-slate-900 dark:text-white">${e.amount_gross.toFixed(2)} ${e.currency}</span>
            ${e.photo ? `<button type="button" onclick="openPhotoModal('${e.photo}')" class="text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-slate-800 px-2 py-1 rounded text-[10px] font-bold border border-blue-100 dark:border-blue-900">📸</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function openPhotoModal(base64Image) {
      if (!base64Image) return;
      document.getElementById('modalImage').src = base64Image;
      document.getElementById('photoModal').classList.remove('hidden');
    }

    function closePhotoModal() {
      document.getElementById('photoModal').classList.add('hidden');
      document.getElementById('modalImage').src = '';
    }

    function exportToCSV() {
      const existing = JSON.parse(localStorage.getItem('fleet_expenses') || '[]');
      if (existing.length === 0) {
        alert("Brak danych do eksportu.");
        return;
      }

      let csvContent = "Data,Pojazd,Kategoria,Kwota,Waluta,Litry,Stan_Licznika,Zdjęcie\n";
      existing.forEach(e => {
        csvContent += `"${e.date}","${e.vehicle}","${e.category}",${e.amount_gross},"${e.currency}",${e.fuel_liters || ''},${e.mileage || ''},"${e.photo ? 'TAK' : 'NIE'}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Raport_Kierowcy_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadVehicleOptions();
      renderRecentExpenses();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    });
  </script>
</body>
</html>
